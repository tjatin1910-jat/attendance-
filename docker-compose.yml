version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - attendance-network

  backend:
    image: attendance-backend:latest
    ports:
      - "8000:8000"
    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge
